# iOS shell — unsigned cloud build (Phase 2 / P2.4).
#
# Why cloud: the founder's Mac is a 2017 Intel on macOS 13 (Xcode 15.2 max) —
# modern iOS/watchOS can't be built locally. GitHub-hosted macos-15 runners
# carry full Xcode + iOS SDKs. Private-repo free tier ≈ 200 real macOS
# minutes/month (~5–10 full builds) — fine for validating the pipeline; if
# quota binds, codemagic.yaml (500 free M2 min/mo) is the documented overflow.
#
# UNSIGNED today (no Apple Developer account yet): validates the whole chain —
# SPM resolve → xcodebuild → .app artifact. The simulator on the old Mac (or
# any Mac) can run the artifact unsigned.
#
# SIGNED FLIP (when the $99 account lands):
#   1. App Store Connect → Users & Access → Integrations → create API key
#      (App Manager role) → download .p8, note Key ID + Issuer ID
#   2. Repo secrets: APP_STORE_CONNECT_KEY_CONTENTS (.8 body),
#      APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID
#   3. Replace the build step with app-store-connect signing +
#      -exportOptionsPlist (upload) + `xcrun altool`/`pilot` TestFlight upload
#      — see docs/README-mobile.md §signed-flip checklist.

name: ios-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/native/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'frontend/native/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install native deps (Capacitor CLI + plugins)
        run: npm ci

      - name: Sync web assets + plugin manifests (SPM — no CocoaPods)
        run: npx cap sync ios

      - name: Show Xcode + SPM resolution
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -resolvePackageDependencies | tail -20

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tail -40

      - name: Build (unsigned, simulator — the one you actually run locally)
        # A device-SDK .app will NOT install into a simulator (wrong slices).
        # This pass produces the x86_64+arm64 simulator build that runs on any
        # Mac's Xcode — including the founder's Intel/Xcode 15.2 (iOS 17.2
        # runtime; Capacitor's deployment target is 14.0, so the newer-SDK
        # binary still installs on the older runtime).
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tail -40

      - name: Collect .app
        run: |
          mkdir -p build/artifact
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/App.app" build/artifact/VoiceNative-unsigned.app
          cp -R "build/DerivedData/Build/Products/Release-iphonesimulator/App.app" build/artifact/VoiceNative-sim.app
          # Companion dSYMs, when present
          find build/DerivedData/Build/Products -name '*.dSYM' -maxdepth 3 -exec cp -R {} build/artifact/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNative-unsigned-${{ github.sha }}
          path: frontend/native/build/artifact/
          retention-days: 14
          if-no-files-found: error

      # ── UI smoke tests (issue #45) ─────────────────────────────────────────
      # Boot a simulator, install the just-built shell, and run Maestro flows.
      # The shell is a WKWebView onto https://www.voice-native.com — so this smoke
      # proves the native wrapper boots and the site renders (it depends on prod
      # being reachable; the screenshot artifact disambiguates a prod blip from an
      # app regression). Runs AFTER the build artifact uploads. Modern Maestro
      # drives the simulator via its embedded XCTest runner (no idb-companion).
      - name: Set up JDK (Maestro runs on the JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          # Pin with `export MAESTRO_VERSION=1.xx.x` before the installer to freeze it.
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        id: sim
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2[0-9]' | head -1 | grep -oE '[0-9A-Fa-f-]{36}' || true)
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -i 'iPhone' | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install app on simulator
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" build/artifact/VoiceNative-sim.app

      - name: Run Maestro smoke flows
        run: maestro --device "${{ steps.sim.outputs.udid }}" test .maestro --format junit --output maestro-report.xml

      - name: Collect Maestro output
        if: always()
        run: |
          mkdir -p maestro-output
          cp -R "$HOME/.maestro/tests" maestro-output/ 2>/dev/null || true
          cp -R artifacts maestro-output/ 2>/dev/null || true
          cp maestro-report.xml maestro-output/ 2>/dev/null || true

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap-maestro-${{ github.sha }}
          path: frontend/native/maestro-output/
          retention-days: 14
          if-no-files-found: ignore
