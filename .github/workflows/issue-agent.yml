name: issue-agent

# Runs the issue agent on one issue, only when the repo owner adds the
# "agent:go" label. Nobody else's label or issue starts a run.
on:
  issues:
    types: [labeled]

concurrency:
  group: issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: github.event.label.name == 'agent:go' && github.event.sender.login == 'Erriccc'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post with the repo's own token so comments come from the
          # GitHub Actions bot, not the Claude app.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Never merge or push to main. Branch protection on main is the real guard.
          claude_args: >-
            --disallowedTools "Bash(gh pr merge:*)" "Bash(git push origin main:*)"
            "Bash(git push origin HEAD:main:*)" "Bash(git push -f:*)" "Bash(git push --force:*)"
          # Commits authored as the owner (CLAUDE.md), not the default claude[bot].
          # TEMPORARY: full output for one debug run. Logs are public; remove after the test.
          show_full_output: true
          bot_id: '97201349'
          bot_name: Erriccc
          prompt: |
            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Follow .github/issue-agent-prompt.md for this issue.
