name: issue-agent

# Runs the issue agent on one issue when the owner opens it, or when the owner
# adds the "agent:go" label (for anyone else's issue). Issues filed as notes
# (label osborn:noted) do not start a run on open.
on:
  issues:
    types: [opened, labeled]

concurrency:
  group: issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.event.sender.login == 'Erriccc' && (
        (github.event.action == 'labeled' && github.event.label.name == 'agent:go') ||
        (github.event.action == 'opened' && github.event.issue.user.login == 'Erriccc' &&
         !contains(github.event.issue.labels.*.name, 'osborn:noted')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post with the repo's own token so comments come from the
          # GitHub Actions bot, not the Claude app.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Never merge or push to main (the Main ruleset is the real guard).
          # Allow the GitHub writes the job exists for: the auto-mode check
          # blocked `gh issue comment` in the first two runs.
          claude_args: >-
            --disallowedTools "Bash(gh pr merge:*)" "Bash(git push origin main:*)"
            "Bash(git push origin HEAD:main:*)" "Bash(git push -f:*)" "Bash(git push --force:*)"
            --allowedTools "Bash(gh issue comment:*)" "Bash(gh issue edit:*)" "Bash(gh pr create:*)" "Bash(gh pr edit:*)"
          # Commits authored as the owner (CLAUDE.md), not the default claude[bot].
          # TEMPORARY: full output for one debug run. Logs are public; remove after the test.
          show_full_output: true
          bot_id: '97201349'
          bot_name: Erriccc
          prompt: |
            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Follow .github/issue-agent-prompt.md for this issue.
