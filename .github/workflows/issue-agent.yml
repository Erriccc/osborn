name: issue-agent

# Runs the issue agent on one issue when the owner opens it (including
# voice-filed issues), or when the owner comments on an issue with a comment
# starting "/agent". No labels start or gate a run.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  agent:
    if: >-
      github.event.sender.login == 'Erriccc' && (
        (github.event_name == 'issues' && github.event.action == 'opened' &&
         github.event.issue.user.login == 'Erriccc') ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/agent')))
    runs-on: ubuntu-latest
    concurrency:
      group: issue-agent-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      before_sha: ${{ steps.before.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Head of the agent's open PR before this run ("none" if there is none),
      # so ci-dispatch starts checks only when this run pushed something new.
      - id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          sha=$(gh pr list --state open --limit 200 --json headRefName,headRefOid,isCrossRepository \
            --jq "map(select((.isCrossRepository | not) and (.headRefName | startswith(\"auto/${ISSUE_NUMBER}-\")))) | first | .headRefOid // empty")
          echo "sha=${sha:-none}" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post with the repo's own token so comments come from the
          # GitHub Actions bot, not the Claude app.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Never merge or push to main (the Main ruleset is the real guard).
          # Allow the GitHub writes the job exists for: the auto-mode check
          # blocked `gh issue comment` in the first two runs.
          claude_args: >-
            --max-turns 80
            --disallowedTools "Bash(gh pr merge:*)" "Bash(git push origin main:*)"
            "Bash(git push origin HEAD:main:*)" "Bash(git push -f:*)" "Bash(git push --force:*)"
            --allowedTools "Bash(gh issue comment:*)" "Bash(gh issue edit:*)" "Bash(gh pr create:*)" "Bash(gh pr edit:*)"
          # Commits authored as the owner (CLAUDE.md), not the default claude[bot].
          bot_id: '97201349'
          bot_name: Erriccc
          # On during the testing phase (founder decision): logs are public. Turn off once runs are stable.
          show_full_output: true
          # Claude waits for sub-agents instead of backgrounding them: a
          # backgrounded steward died when the run ended (#480, run 45943983205).
          settings: '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"}}'
          prompt: |
            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Trigger: ${{ github.event_name }}/${{ github.event.action }}
            ${{ github.event_name == 'issue_comment' && format('Comment: {0}', github.event.comment.html_url) || '' }}
            Follow .github/issue-agent-prompt.md for this issue.
      # The action does not post its final answer in agent mode. Post the
      # final result as one issue comment so every run leaves a visible
      # outcome on the issue. The result text only ever goes through a file,
      # never through an expression.
      - name: Post result on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ.get("EXECUTION_FILE", "")
          result = ""
          try:
              with open(path) as f:
                  data = json.load(f)
              entries = data if isinstance(data, list) else [data]
              for entry in reversed(entries):
                  if isinstance(entry, dict) and entry.get("type") == "result":
                      result = entry.get("result") or ""
                      break
          except Exception:
              result = ""
          run_url = os.environ["RUN_URL"]
          if result.strip():
              limit = 60000
              if len(result) > limit:
                  result = result[:limit] + "\n\n[Truncated. See the run for the rest.]"
              body = f"Issue agent result (run {run_url}):\n\n{result}\n"
          else:
              conclusion = os.environ.get("CONCLUSION") or "no conclusion"
              body = f"Issue agent run ended without a result ({conclusion}). See run {run_url}.\n"
          with open(os.path.join(os.environ["RUNNER_TEMP"], "issue-agent-result.md"), "w") as f:
              f.write(body)
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/issue-agent-result.md"

  # The pull_request runs of a PR opened with GITHUB_TOKEN wait for an
  # "Approve workflows to run" click; workflow_dispatch runs start without one:
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
  # So dispatch, on the agent's own branch, every workflow that runs on
  # pull_request and whose paths filter matches the PR's files. A PR that
  # edits a workflow keeps the click, so its new workflow code runs only once
  # approved. This is its own job so only this token has actions: write.
  ci-dispatch:
    needs: agent
    if: >-
      always() && github.event.sender.login == 'Erriccc' && (
        (github.event_name == 'issues' && github.event.action == 'opened' &&
         github.event.issue.user.login == 'Erriccc') ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/agent')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # Workflow list and paths filters come from the default branch, not the
      # agent's working tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run PR checks on the agent's PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BEFORE_SHA: ${{ needs.agent.outputs.before_sha }}
        run: |
          pr=$(gh pr list --state open --limit 200 --json number,headRefName,headRefOid,isCrossRepository \
            --jq "map(select((.isCrossRepository | not) and (.headRefName | startswith(\"auto/${ISSUE_NUMBER}-\")))) | first // empty | \"\(.number) \(.headRefOid) \(.headRefName)\"")
          if [ -z "$pr" ]; then
            echo "No open PR on an auto/${ISSUE_NUMBER}- branch, so no checks to start."
            exit 0
          fi
          read -r number sha branch <<< "$pr"
          if [ "$sha" = "${BEFORE_SHA:-none}" ]; then
            echo "PR #$number: nothing new to check."
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/$number/files" --paginate --jq '.[].filename')
          if grep -q '^\.github/workflows/' <<< "$files"; then
            echo "PR #$number edits a workflow: approve its held runs on the PR."
            exit 0
          fi
          # paths-ignore and "!" negation patterns are not handled, so checks only ever err toward running.
          # GitHub's "**/" also matches no folder and a case "*" crosses "/", so
          # "**/" is read as "*": this can only run a check more often, never less.
          matches() {
            while IFS= read -r p; do
              p=${p//\*\*\//*}
              while IFS= read -r f; do
                case "$f" in $p) return 0 ;; esac
              done <<< "$files"
            done < <(yq '.on.pull_request.paths // ["**"] | .[]' "$1")
            return 1
          }
          failed=0
          for wf in .github/workflows/*.yml; do
            on_pr=$(yq '.on | has("pull_request")' "$wf")
            [ "$on_pr" = true ] || continue
            if matches "$wf"; then
              gh workflow run "${wf##*/}" --ref "$branch" || failed=1
            else
              echo "Skipped ${wf##*/}: no changed file matches its paths."
            fi
          done
          exit "$failed"
