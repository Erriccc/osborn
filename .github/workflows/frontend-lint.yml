# Zero-cost frontend gate (ubuntu minutes are free on private repos).
# TypeScript + lint on every PR / push touching the frontend — catches the
# class of breakage the iOS shell loads remotely, before Railway deploys it.

name: frontend-lint

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests/voice-e2e/**'
      - '.github/workflows/frontend-lint.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tests/voice-e2e/**'

concurrency:
  group: frontend-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Railway builds without tests/, so production serves the COMMITTED
      # copies in frontend/public/. A skill or harness change that is not
      # re-baked never reaches users. Fail the PR instead of shipping it stale.
      - name: Served skill + harness bundle are in sync with tests/voice-e2e
        run: |
          node scripts/build-harness-bundle.mjs
          git diff --exit-code -- public/browser-screen-recorder-skill.md public/browser-screen-recorder-bundle.json public/voice-e2e-bundle.json \
            || { echo "::error::frontend/public skill/bundle is stale. Run 'node frontend/scripts/build-harness-bundle.mjs' and commit the result."; exit 1; }

      # Every file under frontend/tests/ is a standalone node:assert script
      # (CONTRIBUTING.md). Nothing ran them until now, so assertions landed in
      # PRs and never executed. The runner fails the job if any file fails.
      - name: Frontend tests
        run: npm test

      # NOTE: no `next lint` here — the repo has no ESLint config and next lint
      # drops into its interactive setup prompt on CI (kills the job). tsc is
      # the gate. Wiring a real eslintrc is a separate cleanup for main.
