# Zero-cost frontend gate (ubuntu minutes are free on private repos).
# TypeScript + lint on every PR / push touching the frontend — catches the
# class of breakage the iOS shell loads remotely, before Railway deploys it.

name: frontend-lint

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests/voice-e2e/**'
      - 'agent/.claude/skills/**'
      - '.claude/skills/**'
      - 'agent/tests/skill-secrets.test.ts'
      - '.github/workflows/frontend-lint.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tests/voice-e2e/**'
      - 'agent/.claude/skills/**'
      - '.claude/skills/**'
      - 'agent/tests/skill-secrets.test.ts'

concurrency:
  group: frontend-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Railway builds without tests/, so production serves the COMMITTED
      # copies in frontend/public/. A skill or harness change that is not
      # re-baked never reaches users. Fail the PR instead of shipping it stale.
      - name: Served skill + harness bundle are in sync with tests/voice-e2e
        run: |
          node scripts/build-harness-bundle.mjs
          git diff --exit-code -- public/browser-screen-recorder-skill.md public/browser-screen-recorder-bundle.json public/voice-e2e-bundle.json \
            || { echo "::error::frontend/public skill/bundle is stale. Run 'node frontend/scripts/build-harness-bundle.mjs' and commit the result."; exit 1; }

      # Neither of these is a devDependency: Railway's build is `cd frontend &&
      # npm install` (nixpacks.toml), devDeps included, so declaring them would
      # ship tsx + 26 esbuild platform packages and 26MB of wasm Postgres into
      # every production image to serve test files only. Pinned exactly and
      # installed nowhere but here; --no-save keeps package.json and the
      # lockfile untouched.
      - name: Test-only deps (tsx runner, wasm Postgres)
        run: npm i --no-save --no-package-lock tsx@4.23.15 @electric-sql/pglite@0.5.16

      # Every file under frontend/tests/ is a standalone node:assert script
      # (CONTRIBUTING.md). Nothing ran them until now, so assertions landed in
      # PRs and never executed. The runner fails the job if any file fails.
      - name: Frontend tests
        run: npm test

      # This job already owns shipped-skill integrity (see the bundle-sync step
      # above), and the skill scanner is the only thing standing between a
      # literal password, email or employment history and a skill that types it
      # into real sites. It was as unexecuted as the frontend suites.
      - name: Shipped-skill secret scanner
        run: npx --no-install tsx ../agent/tests/skill-secrets.test.ts

      # NOTE: no `next lint` here — the repo has no ESLint config and next lint
      # drops into its interactive setup prompt on CI (kills the job). tsc is
      # the gate. Wiring a real eslintrc is a separate cleanup for main.
