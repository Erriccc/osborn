# React Native (Expo) iOS — unsigned cloud build (Phase 0).
#
# Mirrors the Capacitor ios-build pipeline but for the Expo app in mobile/:
# `expo prebuild` regenerates the native ios/ project (not committed), then
# xcodebuild produces an unsigned .app. Device slices sideload to the iPhone
# via Sideloadly (free Apple ID); simulator slices run in any Mac's Xcode.
#
# macos-26 (Xcode 26) matches Expo SDK 57 (built for iOS 26). SDK 58 would need
# Xcode 27 — that's why the app pins ~57.
#
# SIGNED FLIP (when the $99 account lands): same as ios-build.yml — App Store
# Connect API key secrets, swap the unsigned flags for signing + TestFlight.

name: rn-ios-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/rn-ios-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/rn-ios-build.yml'

concurrency:
  group: rn-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps (core pinned to SDK 57)
        run: npm install --legacy-peer-deps

      - name: Add SDK-aligned Expo modules
        # Let Expo's resolver pick the exact SDK-57-correct version of each
        # peripheral (avoids the hand-guessed version mismatch that broke the
        # first build). Core (expo/react/react-native/expo-router) is pinned
        # in package.json.
        run: npx expo install expo-router expo-constants expo-linking expo-status-bar expo-haptics react-native-safe-area-context react-native-screens @react-native-async-storage/async-storage expo-web-browser expo-auth-session expo-crypto expo-secure-store @livekit/react-native-expo-plugin @config-plugins/react-native-webrtc

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Discover workspace + scheme
        id: xc
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WS scheme=$SCHEME"

      - name: Build (unsigned, device)
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build > xcodebuild-device.log 2>&1 || {
              echo "::group::compiler errors"; grep -nE "error:|fatal error:|The following build commands failed" xcodebuild-device.log | head -60; echo "::endgroup::";
              echo "::group::last 100 lines"; tail -100 xcodebuild-device.log; echo "::endgroup::";
              exit 1;
            }
          tail -5 xcodebuild-device.log

      - name: Build (unsigned, simulator)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build | tail -60

      - name: Package .app bundles
        working-directory: mobile/ios
        run: |
          mkdir -p artifact
          DEV=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          SIM=$(find build/DD/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          cp -R "$DEV" artifact/VoiceNativeRN-unsigned.app
          cp -R "$SIM" artifact/VoiceNativeRN-sim.app
          echo "Packaged: $DEV + $SIM"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNativeRN-unsigned-${{ github.sha }}
          path: mobile/ios/artifact/
          retention-days: 14
          if-no-files-found: error

      # ── UI smoke tests (issue #45) ─────────────────────────────────────────
      # Boot a simulator, install the just-built .app, and run Maestro flows.
      # Runs AFTER the build artifact is already uploaded, so a smoke failure
      # never hides the build output. Modern Maestro drives the simulator via its
      # embedded XCTest runner (Xcode + CLT only) — no idb-companion needed; if a
      # future run complains about idb, add `brew install idb-companion` here.
      - name: Set up JDK (Maestro runs on the JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        working-directory: mobile
        run: |
          # Pin with `export MAESTRO_VERSION=1.xx.x` before the installer to freeze it.
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        id: sim
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2[0-9]' | head -1 | grep -oE '[0-9A-Fa-f-]{36}' || true)
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -i 'iPhone' | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install app on simulator
        working-directory: mobile/ios
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" artifact/VoiceNativeRN-sim.app

      - name: Run Maestro smoke flows
        working-directory: mobile
        run: maestro --device "${{ steps.sim.outputs.udid }}" test .maestro --format junit --output maestro-report.xml

      - name: Collect Maestro output
        if: always()
        working-directory: mobile
        run: |
          mkdir -p maestro-output
          cp -R "$HOME/.maestro/tests" maestro-output/ 2>/dev/null || true
          cp -R artifacts maestro-output/ 2>/dev/null || true
          cp maestro-report.xml maestro-output/ 2>/dev/null || true

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rn-maestro-${{ github.sha }}
          path: mobile/maestro-output/
          retention-days: 14
          if-no-files-found: ignore
