# Publishes agent/ (npm package "osborn") with npm Trusted Publishing (OIDC): no NPM_TOKEN.
# Release: bump agent/package.json version and merge. A merge to main that touches agent/package.json starts this
# workflow; it stops at the `npm` environment's required reviewer, and does nothing if that version is already on npm.
# A manual `git tag agent-v<ver> && git push origin agent-v<ver>` or workflow_dispatch also works.
name: publish-agent

on:
  push:
    branches: [main]
    paths: ['agent/package.json']
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-agent
  cancel-in-progress: false

jobs:
  # A merge that touches agent/package.json without changing the version (a script or dependency edit) must not publish.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        working-directory: agent
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "osborn@$VERSION" version >/dev/null 2>&1; then
            echo "osborn@$VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # No publish credential here: install scripts, tests and the build run in this job.
  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The commit must be on main and a tag must match the version. A branch can edit this
      # file, so the real gate is the `npm` environment's required reviewer and the tag ruleset.
      - name: Check ref
        working-directory: agent
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "agent-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match agent/package.json version $VERSION (expected agent-v$VERSION)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run from main or an agent-v* tag, not $GITHUB_REF_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
      - name: Install
        working-directory: agent
        run: npm ci --no-audit --no-fund
      # Every agent test, including the shipped-skill secret scan (agent-tests.yml leaves that to frontend-lint).
      - name: Run tests
        working-directory: agent
        run: node ../frontend/scripts/run-tests.mjs .
      # npm pack skips prepublishOnly, so build here; publish ships this exact tarball.
      - name: Build and pack
        working-directory: agent
        run: npm run build && npm pack && mv osborn-*.tgz ../osborn.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: osborn-tarball
          path: osborn.tgz
          retention-days: 7

  # Only this job can mint the OIDC publish token; it runs no package code.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; early Node 24 releases ship an older npm 11.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version
      - uses: actions/download-artifact@v8
        with:
          name: osborn-tarball
      # npm refuses a version that is already published.
      - name: Publish
        run: npm publish ./osborn.tgz --ignore-scripts
