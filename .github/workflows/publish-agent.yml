# Publishes agent/ (npm package "osborn") with npm Trusted Publishing (OIDC): no NPM_TOKEN.
# Release: bump agent/package.json version, merge, then `git tag agent-v<ver> && git push origin agent-v<ver>`.
name: publish-agent

on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for trusted publishing
  contents: read

concurrency:
  group: publish-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Name this environment in npm's trusted-publisher settings so only this job gets a token.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version
      # Only merged code ships: the commit must be on main, a tag must match the version.
      - name: Check ref
        working-directory: agent
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "agent-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match agent/package.json version $VERSION (expected agent-v$VERSION)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run from main or an agent-v* tag, not $GITHUB_REF_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          echo "Publishing osborn@$VERSION"
      - name: Install
        working-directory: agent
        run: npm ci --no-audit --no-fund
      # Every agent test, including the shipped-skill secret scan (agent-tests.yml leaves that to frontend-lint).
      - name: Run tests
        working-directory: agent
        run: node ../frontend/scripts/run-tests.mjs .
      # prepublishOnly builds dist/; npm refuses a version that is already published.
      - name: Publish
        working-directory: agent
        run: npm publish
