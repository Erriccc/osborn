# Fly config for osborn-dev-router — wildcard subdomain fleet router
# Deploy: fly deploy --app osborn-dev-router (from this directory)
# After first deploy: fly certs add "*.dev.voice-native.com" --app osborn-dev-router
# DNS at registrar: *.dev.voice-native.com CNAME osborn-dev-router.fly.dev
app = "osborn-dev-router"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEV_DOMAIN = "dev.voice-native.com"
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [services.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 500

[checks]
  [checks.health]
    type = "http"
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
