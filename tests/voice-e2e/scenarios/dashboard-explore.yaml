name: dashboard-explore
description: Logged-in dashboard exploration — see recent chats, settings, agent health; click around and record findings. Requires the saved osbornojure profile.
url: "/dashboard"
profile: osbornojure
steps:
  - act: "You are on a user dashboard. Open the settings or preferences area if visible"
  - pause: 3000
  - act: "Navigate back to the main dashboard view"
  - pause: 2000
  - act: "Open the most recent conversation/chat from the recent list"
  - pause: 5000
conversation:
  goal: >
    You just opened a recent conversation from the dashboard. Say hello and ask
    the assistant to confirm this session resumed with context. End after its
    reply. Max 1 thing said by you.
  maxTurns: 2
  minAudibleReplies: 1
